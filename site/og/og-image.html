<!doctype html>
<!-- Source for public/og-image.png (1200×630). Regenerate with the command in site/og/README.md.
     Colours copy the tokens in src/styles/global.css, which this standalone file can't import. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500&display=block">
<style>
  :root {
    --bg: #000;
    --bg-raised: #0a0a0a;
    --bg-subtle: #0f0f0f;
    --gray-200: #1f1f1f;
    --gray-400: #2e2e2e;
    --gray-700: #8f8f8f;
    --gray-900: #a1a1a1;
    --gray-1000: #ededed;
    --green: #45a557;
    --font-sans: "Geist", system-ui, sans-serif;
    --font-mono: "Geist Mono", ui-monospace, monospace;
  }
  html, body { margin: 0; width: 1200px; height: 630px; background: var(--bg); color: var(--gray-1000); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  .frame {
    box-sizing: border-box;
    display: grid;
    grid-template-columns: 1fr 480px;
    gap: 56px;
    align-items: center;
    height: 100%;
    padding: 72px;
    border: 1px solid var(--gray-200);
  }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 500; letter-spacing: -0.02em; }
  .brand img { width: 36px; height: 36px; border: 1px solid var(--gray-400); border-radius: 9px; }
  h1 { margin: 40px 0 0; font-size: 62px; font-weight: 500; letter-spacing: -0.055em; line-height: 1.02; }
  .lead { margin: 24px 0 0; font-size: 22px; line-height: 1.45; color: var(--gray-900); }
  .meta { margin: 36px 0 0; font-size: 17px; color: var(--gray-700); }

  .card { padding: 28px; border: 1px solid var(--gray-200); border-radius: 12px; background: var(--bg-raised); }
  .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; font-size: 16px; color: var(--gray-900); }
  .len { font-family: var(--font-mono); font-size: 14px; color: var(--gray-700); }
  .track { position: relative; height: 72px; border: 1px solid var(--gray-200); border-radius: 6px; background: var(--bg-subtle); overflow: hidden; }
  .fill { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, var(--gray-200) 0 2px, transparent 2px 8px); }
  .window { position: absolute; top: 0; bottom: 0; right: 0; width: 24%; display: grid; place-items: center; background: var(--gray-1000); color: #000; font-family: var(--font-mono); font-size: 15px; font-weight: 500; }
  .now { position: absolute; top: 0; bottom: 0; right: 0; width: 3px; background: var(--green); }
  .axis { display: flex; justify-content: space-between; margin-top: 10px; font-family: var(--font-mono); font-size: 13px; color: var(--gray-700); }
  .out { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--gray-200); font-family: var(--font-mono); font-size: 12px; color: var(--gray-700); white-space: nowrap; }
  .tag { flex-shrink: 0; padding: 4px 10px; border: 1px solid color-mix(in srgb, var(--green) 45%, transparent); border-radius: 999px; color: var(--green); }
</style>
</head>
<body>
  <div class="frame">
    <div>
      <div class="brand"><img src="../public/favicon.svg" alt="">Replay Buffer Pro</div>
      <h1>Save the moment you didn't know you'd need</h1>
      <p class="lead">An OBS Studio plugin that saves clips of any length from one replay buffer, without re-encoding.</p>
      <p class="meta">Free and open source · Windows &amp; macOS</p>
    </div>
    <div class="card">
      <div class="head"><span>Replay buffer</span><span class="len">600s</span></div>
      <div class="track"><div class="fill"></div><div class="window">30s</div><div class="now"></div></div>
      <div class="axis"><span>oldest frame</span><span>now</span></div>
      <div class="out"><span>Replay 2026-08-14 21-04-33_trimmed.mkv</span><span class="tag">saved · 30.0s</span></div>
    </div>
  </div>
</body>
</html>

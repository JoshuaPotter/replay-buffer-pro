name: Pull Request
run-name: ${{ github.head_ref }} pull request run
on:
  pull_request:
    branches:
      - main
      - develop
    # Skips pull requests that only change the website, docs or agent config.
    paths-ignore:
      - site/**
      - .github/workflows/pages.yaml
      - .github/workflows/site-check.yaml
      - '**.md'
      - docs/**
      - .agents/**
      - .claude/**
      - skills-lock.json
      - tools/linux-desktop/**
      - tools/flatpak/**
permissions:
  contents: read
jobs:
  build-project:
    name: Build Project
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
    permissions:
      contents: read
